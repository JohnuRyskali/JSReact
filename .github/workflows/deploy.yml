name: Deploy Labs to GitHub Pages

on:
  push:
    branches: [ main ] # Укажите master, если ваша главная ветка называется master

# Разрешения, необходимые для автоматического деплоя в GitHub Pages через Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем параллельные запуск за запуск
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Сборка Лабораторной 3 ---
      - name: Build Lab 3
        run: |
          cd lab3
          npm install
          npm run build

      # --- Сборка Лабораторной 4 ---
      - name: Build Lab 4
        run: |
          cd lab4
          npm install
          npm run build

      # --- Собираем всё в одну общую папку public_html ---
      - name: Organize build output
        run: |
          mkdir public_html
          mkdir public_html/lab3
          mkdir public_html/lab4
          cp -r lab3/dist/* public_html/lab3/
          cp -r lab4/dist/* public_html/lab4/

      # --- Загружаем собранный артефакт для Pages ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public_html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4